<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="mandiriBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0c1322" />
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#mandiriBg)" />
  
  <!-- Subtle decorative circles -->
  <circle cx="200" cy="180" r="160" fill="#0284c7" opacity="0.1" filter="blur(60px)" />
  <circle cx="980" cy="480" r="180" fill="#10b981" opacity="0.08" filter="blur(70px)" />

  <!-- App Window Container -->
  <g transform="translate(100, 50)" filter="url(#winShadow)">
    <rect width="1000" height="575" rx="16" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window Titlebar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 984 0 C 992.84 0 1000 7.16 1000 16 L 1000 52 L 0 52 Z" fill="#0f172a" />
    <circle cx="30" cy="26" r="6" fill="#ef4444" />
    <circle cx="50" cy="26" r="6" fill="#f59e0b" />
    <circle cx="70" cy="26" r="6" fill="#10b981" />
    <rect x="180" y="12" width="640" height="28" rx="14" fill="#1e293b" />
    <text x="360" y="31" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">
      http://localhost/apkkkp &bull; Sistem Presensi Karyawan Mandiri FM
    </text>

    <!-- Top Navigation Header -->
    <rect x="0" y="52" width="1000" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Mandiri FM Branding -->
    <g transform="translate(40, 64)">
      <circle cx="20" cy="20" r="18" fill="#dc2626" />
      <text x="20" y="26" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="16" text-anchor="middle">&#127911;</text>
      <text x="50" y="22" fill="#1e293b" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18">RADIO MANDIRI FM</text>
      <text x="50" y="36" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11">102.0 MHz CILEGON &bull; SISTEM PRESENSI</text>
    </g>

    <!-- System Heading -->
    <text x="500" y="170" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="26" text-anchor="middle">
      Absen Karyawan Mandiri FM Cilegon
    </text>
    <text x="500" y="195" fill="#64748b" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" text-anchor="middle">
      Sistem Informasi Presensi Digital Pegawai &amp; Rekapitulasi Kehadiran
    </text>

    <!-- Left Card: Kehadiran Pegawai -->
    <g transform="translate(100, 230)">
      <rect width="380" height="240" rx="12" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
      <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 368 0 C 374.63 0 380 5.37 380 12 L 380 50 L 0 50 Z" fill="#2563eb" />
      <text x="30" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">&#128197; Portal Kehadiran Karyawan</text>
      
      <text x="30" y="90" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
        Menu untuk karyawan melakukan clock-in
      </text>
      <text x="30" y="110" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
        kehadiran cepat dengan memasukkan NIP.
      </text>

      <!-- Input Simulation -->
      <rect x="30" y="130" width="320" height="40" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text x="45" y="155" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Masukan Nomor Induk Pegawai (NIP)...</text>

      <rect x="30" y="185" width="320" height="36" rx="8" fill="#059669" />
      <text x="190" y="208" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" text-anchor="middle">&#10003; Simpan Kehadiran (Hadir)</text>
    </g>

    <!-- Right Card: Portal Administrator -->
    <g transform="translate(520, 230)">
      <rect width="380" height="240" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 368 0 C 374.63 0 380 5.37 380 12 L 380 50 L 0 50 Z" fill="#0284c7" />
      <text x="30" y="32" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16">&#128100; Dashboard Administrator</text>
      
      <text x="30" y="90" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
        Menu pengelolaan data pegawai, validasi izin,
      </text>
      <text x="30" y="110" fill="#334155" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
        sakit, rekap kehadiran bulanan, &amp; cetak laporan.
      </text>

      <!-- Admin Badges -->
      <g transform="translate(30, 130)">
        <rect width="150" height="35" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
        <text x="75" y="152" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">&#128203; Rekap Presensi</text>

        <rect x="170" y="0" width="150" height="35" rx="6" fill="#f1f5f9" stroke="#e2e8f0" />
        <text x="245" y="152" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-anchor="middle">&#128424; Cetak Laporan</text>
      </g>

      <rect x="30" y="185" width="320" height="36" rx="8" fill="#1e293b" />
      <text x="190" y="208" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" text-anchor="middle">Masuk Sebagai Administrator &rarr;</text>
    </g>

    <!-- Footer info inside window -->
    <text x="500" y="530" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">
      Tugas Akhir / Kerja Praktek (KKP) Program Studi Sistem Informasi &bull; Stasiun Radio Mandiri FM Cilegon
    </text>
  </g>
</svg>
