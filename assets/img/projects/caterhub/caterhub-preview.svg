<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Decorative Blurs -->
  <circle cx="200" cy="150" r="180" fill="#f97316" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="500" r="220" fill="#3b82f6" opacity="0.1" filter="blur(70px)" />

  <!-- Main App Frame Window -->
  <g transform="translate(100, 60)" filter="url(#cardShadow)">
    <!-- Browser/Window Header -->
    <rect width="1000" height="555" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 984 0 C 992.84 0 1000 7.16 1000 16 L 1000 56 L 0 56 Z" fill="#0f172a" />
    
    <!-- Window Controls -->
    <circle cx="30" cy="28" r="6" fill="#ef4444" />
    <circle cx="50" cy="28" r="6" fill="#f59e0b" />
    <circle cx="70" cy="28" r="6" fill="#10b981" />
    
    <!-- Address Bar -->
    <rect x="180" y="14" width="640" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="360" y="33" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500">
      https://caterhub.local/marketplace &bull; B2B Corporate Catering
    </text>

    <!-- App Navigation Bar inside Window -->
    <rect x="0" y="56" width="1000" height="60" fill="#0f172a" border-bottom="1px solid #1e293b" />
    
    <!-- CaterHub Logo -->
    <g transform="translate(40, 72)">
      <rect width="32" height="32" rx="8" fill="url(#brandGrad)" />
      <text x="16" y="22" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="bold" font-size="18" text-anchor="middle">C</text>
      <text x="44" y="23" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">Cater<tspan fill="#f97316">Hub</tspan></text>
      <rect x="155" y="4" width="70" height="20" rx="10" fill="#334155" />
      <text x="190" y="18" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" text-anchor="middle">B2B PORTAL</text>
    </g>

    <!-- Nav Items -->
    <text x="560" y="92" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Jelajahi Menu</text>
    <text x="680" y="92" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Vendor Katering</text>
    <text x="810" y="92" fill="#cbd5e1" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600">Invoice Kantor</text>
    
    <!-- User Badge -->
    <rect x="880" y="73" width="90" height="30" rx="15" fill="#f97316" />
    <text x="925" y="93" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Dashboard</text>

    <!-- Main Content Area -->
    <!-- Hero Banner inside Mockup -->
    <rect x="40" y="136" width="920" height="150" rx="12" fill="#090d16" stroke="#334155" stroke-width="1" />
    <g transform="translate(70, 165)">
      <rect width="210" height="24" rx="12" fill="#1e293b" />
      <text x="105" y="16" fill="#fbbf24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">&#127860; Solusi Makan Siang Perusahaan</text>
      
      <text x="0" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800">
        Katering Kantor Otomatis &amp; Terjadwal
      </text>
      <text x="0" y="80" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13">
        Multi-vendor katering bersertifikasi halal, pengiriman terjadwal, &amp; otomatisasi invoice perusahaan.
      </text>
    </g>

    <!-- Stat Pills inside Mockup -->
    <g transform="translate(680, 155)">
      <rect width="250" height="110" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="20" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Total Pesanan Kantor</text>
      <text x="20" y="65" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">1.420+ <tspan fill="#10b981" font-size="14">Porsi</tspan></text>
      <text x="20" y="92" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">&#10003; 100% Invoicing Otomatis</text>
    </g>

    <!-- 3 Cards inside Mockup -->
    <!-- Card 1 -->
    <g transform="translate(40, 306)">
      <rect width="290" height="215" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect width="290" height="95" rx="10" fill="#334155" opacity="0.6" />
      <text x="145" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&#127857; Nasi Liwet Komplit Solo</text>
      <rect x="15" y="105" width="60" height="18" rx="9" fill="#065f46" />
      <text x="45" y="117" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">HALAL</text>
      <text x="15" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Rp 35.000 / porsi</text>
      <text x="15" y="168" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Vendor: Sari Rasa Catering (Rating: 4.9)</text>
      <rect x="15" y="180" width="260" height="26" rx="6" fill="#f97316" />
      <text x="145" y="197" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Pesan Katering Kantor</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(355, 306)">
      <rect width="290" height="215" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect width="290" height="95" rx="10" fill="#334155" opacity="0.6" />
      <text x="145" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&#127837; Bento Premium Chicken Katsu</text>
      <rect x="15" y="105" width="75" height="18" rx="9" fill="#1e3a8a" />
      <text x="52" y="117" fill="#93c5fd" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">CORPORATE</text>
      <text x="15" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Rp 42.000 / porsi</text>
      <text x="15" y="168" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Vendor: Tokyo Kitchen B2B (Rating: 5.0)</text>
      <rect x="15" y="180" width="260" height="26" rx="6" fill="#f97316" />
      <text x="145" y="197" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Pesan Katering Kantor</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(670, 306)">
      <rect width="290" height="215" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <rect width="290" height="95" rx="10" fill="#334155" opacity="0.6" />
      <text x="145" y="55" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">&#129367; Healthy Mediterranean Bowl</text>
      <rect x="15" y="105" width="80" height="18" rx="9" fill="#065f46" />
      <text x="55" y="117" fill="#6ee7b7" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" text-anchor="middle">LOW CALORIE</text>
      <text x="15" y="145" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700">Rp 48.000 / porsi</text>
      <text x="15" y="168" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Vendor: GreenGourmet ID (Rating: 4.8)</text>
      <rect x="15" y="180" width="260" height="26" rx="6" fill="#f97316" />
      <text x="145" y="197" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">+ Pesan Katering Kantor</text>
    </g>
  </g>
</svg>
